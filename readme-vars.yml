# application setup block
app_setup_block_enabled: true
app_setup_block: |
  The application can be accessed at:

  * https://yourhost:3001/

  ### Customizations in this fork

  These additions belong to [Der-Jan/docker-orcaslicer](https://github.com/Der-Jan/docker-orcaslicer). Build this repository with `docker build -t orcaslicer-custom:local .` and use `orcaslicer-custom:local` instead of the upstream image name in the examples below. Save open projects, then recreate the container from the new image while keeping the existing `/config` and `/data/orcaslicer` volumes; restarting an existing container does not change its image.

  #### OrcaSlicer nightly and Support Fins

  This private image uses the official OrcaSlicer 2.5 nightly AppImage and includes [Support Fins](https://github.com/gittrahan/support-fins/tree/main/plugins/orca). The previous MCP fork and OpenAI tunnel are preserved on the `mcp-integration` branch.

  Orca starts with `--datadir /data/orcaslicer`. Persist that directory separately from `/config`, which remains the desktop home and contains `/config/Projects`. Profiles, OrcaCloud login, plugin activation and plugin settings live in `/data/orcaslicer`. The instance machine identity is kept in `/data/orcaslicer/.machine-id` and restored before Orca starts, preserving its encrypted cloud login when the base image changes. Keep this file with the data volume and its backups. Before upgrading an existing installation, save projects and stop Orca, back up its data, then move `/config/.config/OrcaSlicer` into the new volume. Move `/config/.config/orcaslicer-nextcloud` into `/data/orcaslicer/nextcloud` as well. Preserve ownership and permissions. Remove the old `python/packages` directory from the migrated copy after keeping it in your backup; the image links its bundled packages there at startup. The image does not automatically move existing user data.

  Support Fins and Project storage code live under `/usr/local/share/orcaslicer/plugins` in the image. Each plugin directory under `/data/orcaslicer/orca_plugins` links its code to the image while keeping `.install_state.json` and other user state in the volume. NumPy, mini-racer and their dependencies are installed at image build time under `/usr/local/share/orcaslicer/python/<ABI>` and linked individually into Orca's shared Python package directory. The bundled Support Fins metadata omits runtime dependency installation; its original requirements are recorded alongside the code in `requirements.txt`. NumPy masked-array and linear-algebra modules initialize at plugin load time so slicing does not trigger sandbox permission prompts for library imports. Dependencies of additional user-installed plugins are still managed by Orca. Bundled package paths must not contain old regular directories that would hide the image links.

  Open **Plugins** in OrcaSlicer's main menu and enable **Support Fins**. Then switch process settings to **Advanced**, open **Others > Slicing Pipeline Plugin > Add plugin**, and choose **Support Fins**. Approve OrcaSlicer's permission prompts when you first slice. Parts with **Enable support** turned on are skipped; turn it off for parts that should receive fins. Fins are generated during slicing and appear in Preview, rather than as added objects in Prepare.

  `ORCASLICER_VERSION` defaults to the upstream `nightly-builds` release. `SUPPORT_FINS_VERSION` can select a plugin commit or tag; unset, the build records the current `main` commit in `/usr/local/share/orcaslicer/plugins/SupportFins/VERSION`. Rebuild the image to fetch newer nightly/plugin code. Image-provided plugin code and packages update with the image; activation and configuration remain in the data volume.

  #### Device panel

  All custom interface text is in English. Follow the [UI requirements](tools/UI-GUIDELINES.md) for future changes.

  Open **Device** on the right edge of the browser desktop to show the printer's live Fluidd interface. The button uses the same label and icon as OrcaSlicer's Device tab. Overlay the desktop, pin the panel beside it, or drag its left edge to resize it. Width and pin preference are saved in the browser. The camera button opens a camera-only view inside the panel. **Back to Device**, clicking the camera button again, or Escape restores the normal view.

  The panel follows the selected machine's saved `print_host` and `printhost_apikey` in OrcaSlicer, checking every two seconds. Save the printer address and API key in Orca's printer connection settings. The container injects the key into Moonraker HTTP and WebSocket requests; it is not included in browser configuration or metadata. Browser forwarding headers are removed from Moonraker requests. Changes to the saved profile or key close the previous connection and reload the panel. Missing or ambiguous profiles show a status message.

  Fluidd, Moonraker WebSocket and webcam traffic pass through the container's existing browser entrypoint and its authentication. No extra exposed port is needed, and the printer itself needs no HTTPS or direct browser access. Current support targets QIDI/Fluidd printers with Moonraker on port 7125 and a `/webcam/` camera endpoint. When using a subfolder-only reverse proxy, also forward `/webcam/` for camera URLs received over WebSocket.

  The original Selkies page remains accessible at `desktop.html` for troubleshooting. See [Device panel details](tools/printer-panel/README.md) for configuration limits and implementation notes.

  #### Nextcloud login

  After login, select the Nextcloud directory for your projects: open folders in the panel, use the up arrow to return to the parent, and confirm **Use this folder**. The panel lists existing folders through WebDAV, using Nextcloud's actual account ID even when you sign in with an email address. The chosen directory is stored with the connection, remains available after restarts, and can be changed at any time. No files are synchronized or moved by this selection.

  Open **Nextcloud** on the right edge of the browser desktop, enter your Nextcloud HTTPS address (including its subdirectory if applicable), and choose **Connect to Nextcloud**. Login Flow v2 opens Nextcloud in a separate browser tab for login and access approval, including your configured SSO or two-factor authentication. If the tab is blocked, use the displayed login link. The server must be reachable from both the browser and container with a valid TLS certificate. Reverse proxies must permit Nextcloud's `/index.php/login/v2` and polling endpoints without requiring a separate proxy login from the container.

  The backend runs as `abc`, stores the connection and folder selection in `/data/orcaslicer/nextcloud/credentials.json` (directory mode `0700`, file mode `0600`), and exposes status through the existing authenticated browser entrypoint. App passwords and polling tokens are not returned to the browser. **Disconnect** stops synchronization, removes the local credentials, and attempts to revoke the app password in Nextcloud; if the server is unreachable, revoke it manually under Nextcloud's security settings. See [Nextcloud Login Flow v2](https://docs.nextcloud.com/server/stable/developer_manual/client_apis/LoginFlow/index.html#login-flow-v2).

  Choose a dedicated Nextcloud subfolder and click **Start syncing** to enable rclone bisync with `/config/Projects`, including `Sources`. It runs every 30 seconds, supports uploads, downloads and deletions on either side, and preserves simultaneous edits with local/cloud conflict filenames. The first run merges both directories; remote files replaced during that merge are moved into `.orcaslicer-sync-history/` at the Nextcloud account root. Subsequent runs use persistent comparison state under `/data/orcaslicer/nextcloud/bisync/`. There are no additional staging copies or application upload queue; rclone uses its normal temporary files for safe downloads. Files without server-side hashes are streamed for checksum calculation when needed. Temporary `.part`, `.partial`, `.tmp`, and `.new` files are excluded. Do not remove `.orcaslicer-sync-check` from either folder; it guards access and permits syncing otherwise empty folders. Connection failures retry, while critical errors remain visible rather than automatically resetting the comparison state. Private logs are `bisync/<session>/sync.log`.

  The initial implementation pauses synchronization while a saved Orca project is open, or its Project-storage status is unavailable; close it or open a new project to resume. This prevents incoming changes from replacing an active project file. **Sync now** requests an immediate run. **Stop syncing** persists the stopped state; enabled synchronization and its last successful time survive restarts. Stop synchronization before changing the remote folder. The Nextcloud file/3D browser is not implemented yet.

  The Nextcloud panel button shows a status LED even when the panel is closed: red for no saved connection, a sync error or unavailable status; green for a connected account without a reported error; blinking green during a sync request or run. The tooltip provides the status in text. Green also applies when syncing is stopped or waiting; it does not perform a separate connectivity check. With reduced motion enabled, the LED stays steady.

  #### Wayland window and file uploads

  In Wayland mode, OrcaSlicer's main window has no desktop title bar or frame. Dialogs retain their normal window decorations.

  Completed browser uploads of STL, OBJ, STEP/STP, and 3MF files are automatically processed by a supervised service that starts with the container. Keep OrcaSlicer maximized on **Prepare**, with its canvas covering the screen center. The upload directory is `FILE_MANAGER_PATH`, default `/config/Desktop`. Existing files, partial uploads, ordinary saves, and `.gcode.3mf` files are ignored; failed drops are not retried automatically. Uploaded originals remain in the upload directory. This feature requires a single Wayland output and is disabled in X11 mode.

  The bundled **Project storage** plugin is installed and enabled on first startup. With an empty, unnamed project, the first uploaded model creates `/config/Projects/<filename-without-extension>/<project-name>.3mf` and copies its original into `Sources/`. Orca's CLI supplies the geometry; the current session supplies printer, filament and process settings, including unsaved profile changes. The description records the source filename. A dropped 3MF is copied to its own project directory. Existing folders and source filenames receive numeric suffixes rather than being overwritten. Further model uploads are copied into `Sources/` beside the currently opened project and imported there. Save an already populated unnamed project before uploading more files.

  If automatic 3MF creation fails (including STEP/STP files unsupported by the CLI), the helper instead drops the preserved original from the new project's `Sources` folder into the unchanged empty editor. A visible **Project storage** message explains the fallback and the suggested **Save Project As** path. The project remains unsaved until you save it yourself. Invalid or empty CLI archives are rejected and partial 3MF files are removed. Import diagnostics are private files under `/data/orcaslicer/import-logs`, outside the project sync folder. A conversion error never bypasses the active-project check or retries an unconfirmed drop.

  Orca's normal project-loading and modified-profile dialogs remain under user control. Choose **Preferences > Project > Load behavior > Load All** or choose **Open as project** when asked. Until Orca confirms the prepared project's path/import, further uploads are held back. If opening is cancelled, open the prepared 3MF manually or run **Project storage** from Orca's Plugins dialog and choose **Cancel pending import**; prepared files are retained and the logs show their paths. The plugin must remain enabled, and exactly one Orca editor may be running. Configure Nextcloud synchronization through the browser panel; archiving sent G-code is not implemented. See [Wayland file drop details](tools/wayland-file-drop/README.md).
