development_versions: false
# container parameters
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/config", desc: "Desktop home and project files, including /config/Projects."}
  - {vol_path: "/data/orcaslicer", vol_host_path: "/path/to/orcaslicer", desc: "Orca settings, profiles, account state and plugin settings."}
param_usage_include_ports: true
param_ports:
  - {external_port: "3000", internal_port: "3000", port_desc: "Orca Slicer desktop gui HTTP, must be proxied."}
  - {external_port: "3001", internal_port: "3001", port_desc: "Orca Slicer desktop gui HTTPS."}
