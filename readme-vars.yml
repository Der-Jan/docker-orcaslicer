---

# project information
project_name: orcaslicer
project_url: "https://github.com/SoftFever/OrcaSlicer"
project_logo: "https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/orcaslicer-logo.png"
project_blurb: "[Orca Slicer]({{ project_url }}) is an open source slicer for FDM printers. OrcaSlicer is fork of Bambu Studio, it was previously known as BambuStudio-SoftFever, Bambu Studio is forked from PrusaSlicer by Prusa Research, which is from Slic3r by Alessandro Ranellucci and the RepRap community"
project_lsio_github_repo_url: "https://github.com/linuxserver/docker-{{ project_name }}"
project_categories: "3D Printing"
project_blurb_optional_extras_enabled: false
# supported architectures
available_architectures:
  - {arch: "{{ arch_x86_64 }}", tag: "latest"}
  - {arch: "{{ arch_arm64 }}", tag: "arm64v8-latest"}
# development version
development_versions: false
# container parameters
common_param_env_vars_enabled: true
param_container_name: "{{ project_name }}"
param_usage_include_vols: true
param_volumes:
  - {vol_path: "/config", vol_host_path: "/path/to/config", desc: "Users home directory in the container, stores program settings and files."}
param_usage_include_ports: true
param_ports:
  - {external_port: "3000", internal_port: "3000", port_desc: "Orca Slicer desktop gui HTTP, must be proxied."}
  - {external_port: "3001", internal_port: "3001", port_desc: "Orca Slicer desktop gui HTTPS."}
opt_custom_params:
  - {name: "shm-size", name_compose: "shm_size", value: "1gb", desc: "We set this to 1 gig to prevent modern web browsers from crashing"}
# Selkies blurb settings
selkies_blurb: true
show_nvidia: true
# application setup block
app_setup_block_enabled: true
app_setup_block: |
  The application can be accessed at:

  * https://yourhost:3001/

  This private image installs the [MaxEllis OrcaSlicer fork](https://github.com/MaxEllis/OrcaSlicer/releases) and its separate MCP server. The optional OpenAI Secure MCP Tunnel starts automatically when configured; no additional inbound ports are needed.

  In Wayland mode, OrcaSlicer's main window has no desktop title bar or frame. Dialogs retain their normal window decorations.

  Completed browser uploads of STL, OBJ, STEP/STP, and 3MF files are automatically dropped at the screen center by a supervised service that starts with the container. Keep OrcaSlicer maximized on **Prepare**, with its canvas covering that point. The upload directory is `FILE_MANAGER_PATH`, default `/config/Desktop`. Existing files, partial uploads, ordinary saves, and `.gcode.3mf` files are ignored; failed drops are not retried automatically. Files remain in the upload directory. This feature requires a single Wayland output and is disabled in X11 mode. A 3MF follows OrcaSlicer's normal project-opening behavior and may show prompts. See `tools/wayland-file-drop/README.md` for details.

  Complete OrcaSlicer's setup wizard, then enable **Preferences > Remote API > Enable Remote API**. Keep **Allow LAN access** disabled. The MCP launcher reads the saved token and port from `/config/.config/OrcaSlicer/OrcaSlicer.conf`; it does not change your settings. If you regenerate the token, restart the container.

  Create a tunnel and runtime API key in [OpenAI Platform tunnel settings](https://platform.openai.com/settings/organization/tunnels), and associate the tunnel with your ChatGPT workspace. Set `MCP_TUNNEL_ID` to that tunnel's ID and mount a file containing the runtime API key read-only at `/run/secrets/mcp_runtime_api_key`. Keep the key out of the Dockerfile and build arguments. With no tunnel ID, the tunnel service stays disabled.

  For example, add these settings to your existing Compose service:

  ```yaml
  environment:
    MCP_TUNNEL_ID: tunnel_0123456789abcdef0123456789abcdef
  volumes:
    - /path/to/runtime-api-key:/run/secrets/mcp_runtime_api_key:ro
  ```

  Recreate the container and check its logs for `[orcaslicer-mcp-tunnel] Starting OpenAI tunnel`. In ChatGPT, add a custom MCP server, choose **Tunnel**, and select this tunnel. The local MCP server needs no separate authentication; the tunnel uses your OpenAI organization/workspace access, while OrcaSlicer's Remote API remains token-authenticated on loopback. See [Secure MCP Tunnel](https://developers.openai.com/api/docs/guides/secure-mcp-tunnels) for account permissions and connection instructions.

  Build arguments `ORCASLICER_VERSION` (a fork release tag), `ORCASLICER_MCP_VERSION` (a Python package version), and `TUNNEL_CLIENT_VERSION` (a tunnel-client release tag) can select specific versions. Unset arguments use the latest release/package available at build time. Both application and tunnel downloads are checked against their release SHA-256 manifests.
# init diagram
init_diagram: |
  "orcaslicer:latest": {
    docker-mods
    base {
      fix-attr +\nlegacy cont-init
    }
    docker-mods -> base
    legacy-services
    custom services
    init-services -> legacy-services
    init-services -> custom services
    custom services -> legacy-services
    legacy-services -> ci-service-check
    init-migrations -> init-adduser
    init-os-end -> init-config
    init-selkies-end -> init-config
    init-config -> init-config-end
    init-crontab-config -> init-config-end
    init-config -> init-crontab-config
    init-mods-end -> init-custom-files
    init-adduser -> init-device-perms
    base -> init-envfile
    base -> init-migrations
    init-config-end -> init-mods
    init-mods-package-install -> init-mods-end
    init-mods -> init-mods-package-install
    init-selkies -> init-nginx
    init-adduser -> init-os-end
    init-device-perms -> init-os-end
    init-envfile -> init-os-end
    init-os-end -> init-selkies
    init-nginx -> init-selkies-config
    init-video -> init-selkies-end
    init-custom-files -> init-services
    init-selkies-config -> init-video
    init-services -> svc-cron
    svc-cron -> legacy-services
    init-services -> svc-dbus
    init-services -> svc-orcaslicer-mcp-tunnel
    svc-orcaslicer-mcp-tunnel -> legacy-services
    init-services -> svc-orcaslicer-desktop-drop
    svc-orcaslicer-desktop-drop -> legacy-services
    svc-xorg -> svc-dbus
    svc-dbus -> legacy-services
    init-services -> svc-de
    legacy-cont-init -> svc-de
    svc-nginx -> svc-de
    svc-selkies -> svc-de
    svc-xorg -> svc-de
    svc-de -> legacy-services
    init-services -> svc-docker
    svc-docker -> legacy-services
    init-services -> svc-nginx
    svc-nginx -> legacy-services
    init-services -> svc-pulseaudio
    svc-pulseaudio -> legacy-services
    init-services -> svc-selkies
    svc-nginx -> svc-selkies
    svc-pulseaudio -> svc-selkies
    svc-xorg -> svc-selkies
    svc-selkies -> legacy-services
    init-services -> svc-watchdog
    svc-watchdog -> legacy-services
    init-services -> svc-xorg
    svc-xorg -> legacy-services
    init-services -> svc-xsettingsd
    svc-nginx -> svc-xsettingsd
    svc-xorg -> svc-xsettingsd
    svc-xsettingsd -> legacy-services
  }
  Base Images: {
    "baseimage-selkies:debiantrixie" <- "baseimage-debian:trixie"
  }
  "orcaslicer:latest" <- Base Images
