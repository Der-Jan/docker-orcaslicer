<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="printer-panel/">
  <title>OrcaSlicer · Device</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="workspace" aria-label="OrcaSlicer">
    <iframe id="desktop-frame" title="OrcaSlicer Desktop" src="../desktop.html" allow="clipboard-read; clipboard-write; fullscreen; autoplay; gamepad"></iframe>
  </main>

  <button id="printer-toggle" class="edge-tab" aria-controls="printer-panel" aria-expanded="false" title="Device-Ansicht öffnen">
    <svg class="device-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><line x1="4.5" y1="14.5" x2="14.5" y2="14.5" style="fill:none;stroke:#fff;stroke-linecap:square;stroke-miterlimit:10"/><line x1="8.5" y1="9.5" x2="9.5" y2="11.5" style="fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round"/><line x1="10.5" y1="9.5" x2="9.5" y2="11.5" style="fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round"/><line x1="4.5" y1="6.5" x2="7" y2="6.5" style="fill:none;stroke:#fff;stroke-linecap:square;stroke-miterlimit:10"/><line x1="12" y1="6.5" x2="14.5" y2="6.5" style="fill:none;stroke:#fff;stroke-linecap:square;stroke-miterlimit:10"/><rect x="7.5" y="4.5" width="4" height="5" rx="0.5" style="fill:none;stroke:#fff;stroke-miterlimit:10"/><rect x="1.5" y="2.5" width="16" height="15" rx="1" style="fill:none;stroke:#fff;stroke-miterlimit:10"/><rect x="9" y="7" width="1" height="1" style="fill:#fff"/></svg>
    <span>Device</span><span id="tab-arrow" aria-hidden="true">‹</span>
  </button>

  <aside id="printer-panel" aria-label="Device-Ansicht" hidden>
    <div id="resize-handle" role="separator" aria-label="Breite der Device-Ansicht" aria-orientation="vertical" aria-valuemin="360" aria-valuemax="1200" aria-valuenow="620" tabindex="0"></div>
    <header class="panel-header">
      <div class="printer-identity"><span class="identity-mark"><svg class="device-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><line x1="4.5" y1="14.5" x2="14.5" y2="14.5" style="fill:none;stroke:#fff;stroke-linecap:square;stroke-miterlimit:10"/><line x1="8.5" y1="9.5" x2="9.5" y2="11.5" style="fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round"/><line x1="10.5" y1="9.5" x2="9.5" y2="11.5" style="fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round"/><line x1="4.5" y1="6.5" x2="7" y2="6.5" style="fill:none;stroke:#fff;stroke-linecap:square;stroke-miterlimit:10"/><line x1="12" y1="6.5" x2="14.5" y2="6.5" style="fill:none;stroke:#fff;stroke-linecap:square;stroke-miterlimit:10"/><rect x="7.5" y="4.5" width="4" height="5" rx="0.5" style="fill:none;stroke:#fff;stroke-miterlimit:10"/><rect x="1.5" y="2.5" width="16" height="15" rx="1" style="fill:none;stroke:#fff;stroke-miterlimit:10"/><rect x="9" y="7" width="1" height="1" style="fill:#fff"/></svg></span><div><strong id="printer-name">Device</strong><small>Ausgewähltes Orca-Profil · Fluidd</small></div></div>
      <div class="panel-actions">
        <button id="pin" class="icon-button" aria-label="Neben dem Slicer anheften" aria-pressed="false" title="Neben dem Slicer anheften"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM14 4v16"/></svg></button>
        <button id="expand" class="icon-button" aria-label="Ansicht verbreitern" title="Ansicht verbreitern"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button id="close" class="icon-button" aria-label="Device-Ansicht schließen" title="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <div class="frame-container">
      <p id="printer-status" role="status" hidden></p>
      <iframe id="printer-frame" title="Fluidd – Druckersteuerung" src="about:blank" allow="fullscreen" referrerpolicy="same-origin"></iframe>
    </div>
    <footer><span id="mode-label">Über dem Slicer</span><a href="device/" target="_blank" rel="noopener">In eigenem Tab öffnen <span aria-hidden="true">↗</span></a></footer>
  </aside>
  <script src="panel.js"></script>
</body>
</html>
